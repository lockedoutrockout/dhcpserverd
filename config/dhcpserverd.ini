[LOGGING]
# File to write logs to. If not specified, log messages will be written to STDOUT/STDERR
log_file=/var/log/dhcpserverd/dhcpserverd.log
# Set the log level. Use '-1' for debug, '0' for info, '1' for error
log_level=-1

[HARDWARE]
# Name of the interface to serve on
interface=wlo1

[DHCP]
# Beginning of the IP address range used for dynamic leases
ip_lease_pool_start=192.168.0.10
# End of the IP address range used for dynamic leases
ip_lease_pool_end=192.168.0.100
# Length of time that dynamically assigned IP address leases remain valid for
ip_lease_duration=24h
# Network gateway IP address provided to clients in DHCP option 3
gateway_ip=192.168.0.1
# DNS server IP address provided to clients in DHCP option 6
dns_server_ip=192.168.0.1

[DNSMASQ]
# Path to the dnsmasq binary
executable=/usr/sbin/dnsmasq
# Path to use for the dnsmasq configuration file
config_file=/etc/dnsmasq.conf
# Path to use for dnsmasq's DHCP leases file
leases_file=/run/dhcpserverd/leases
# Path to use for dnsmasq's DHCP hosts file
hosts_file=/run/dhcpserverd/hosts


